<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Competitor pricing</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="title-row">
          <h1>TinyFish Competitor pricing</h1>
          <button id="run-all" type="button">Run all</button>
        </div>
        <p>
          Use TinyFish to see what TinyFish competitors charge, including plan
          limits and free tiers, in one place. When a price or limit changes, it
          shows up here for comparison.
        </p>
      </header>
      <p id="status" role="status"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Competitor</th>
              <th>Plans</th>
              <th>Last run</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="competitors"></tbody>
        </table>
      </div>
      <h2>Changes</h2>
      <ol id="feed"></ol>
      <h2>Log</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Request</th>
              <th>Sent</th>
              <th>Returned</th>
              <th>Latency</th>
            </tr>
          </thead>
          <tbody id="log"></tbody>
        </table>
      </div>
      <button id="log-more" type="button" hidden>Load more</button>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
